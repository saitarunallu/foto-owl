kind = "mobile"
previewPath = "/"
title = "Foto Owl"
description = "A native React Native photo gallery app for the Foto Owl internship assignment, with local authentication, persistent favorites, image discovery, downloads, and profile management."
version = "1.0.0"
id = "artifacts/foto-owl"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22458

[services.development]
run = "pnpm --filter @workspace/foto-owl run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/foto-owl", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/foto-owl", "run", "serve" ]

[services.env]
PORT = "22458"
BASE_PATH = "/"
